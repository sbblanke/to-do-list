[project]
name = "to-do-list"
version = "0.1.0"
description = "Text-based task manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "bandit", "pip-audit", "pre-commit"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
